name: Daily job email

on:
  schedule:
    # 12:07 UTC = 7:07am Central in summer, 6:07am in winter. Every day.
    - cron: "7 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m jobmail.main
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      - name: Remember which jobs were emailed
        run: |
          git config user.name "jobmail-bot"
          git config user.email "jobmail-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Jobs emailed $(date -u +%F)"
          git push
