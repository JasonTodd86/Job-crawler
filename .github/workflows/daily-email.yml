name: Daily job email

on:
  schedule:
    # GitHub starts scheduled runs late, and sometimes skips them, when it's
    # busy. So the job is scheduled several times a day; the first one that
    # runs sends the email and the rest see it went out and stop.
    # Times are UTC: 4:23am, 6:41am, 8:17am and 11:53am Central (summer).
    - cron: "23 9 * * *"
    - cron: "41 11 * * *"
    - cron: "17 13 * * *"
    - cron: "53 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs overlap, or both could send the same day's email.
concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      # Scheduled runs stop if today's email already went out; a manual run always sends.
      - run: python -m jobmail.main ${{ github.event_name == 'schedule' && '--once-per-day' || '' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      - name: Remember which jobs were emailed
        run: |
          git config user.name "jobmail-bot"
          git config user.email "jobmail-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Jobs emailed $(date -u +%F)"
          git pull --rebase --quiet
          git push
