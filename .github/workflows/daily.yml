name: Daily job search

on:
  schedule:
    - cron: "17 12 * * *"  # ~7-8am US Central, daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m job_crawler.main
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Commit report
        run: |
          git config user.name "job-crawler-bot"
          git config user.email "job-crawler-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Job report $(date -u +%F)"
          git push
