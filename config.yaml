# Job search criteria. Edit this file to change what the crawler looks for.

searches:
  # Each query is sent to every enabled source.
  # Keep this list short: JSearch's free tier allows a limited number of
  # requests per month, and each query costs 2 per run (remote + local).
  queries:
    - "salesforce developer"
    - "salesforce engineer"
    - "salesforce development manager"
  country: us
  max_days_old: 7

title:
  # Every group must have at least one term present in the job title.
  required_groups:
    - ["salesforce", "apex", "sfdc", "lwc", "lightning"]
    - ["developer", "engineer", "architect", "programmer", "lead",
       "manager", "director", "head of", "vp"]
  # Titles containing any of these are dropped.
  exclude: ["intern", "internship", "junior", "jr.", "entry level", "apprentice",
            "account executive", "account manager", "sales rep", "customer success",
            "project manager", "program manager", "marketing manager"]

work_mode:
  allow_remote: true
  allow_hybrid: true
  # Where to look for local (hybrid) jobs.
  hybrid_search_location: "Example City, MO"
  hybrid_search_radius_miles: 40
  # Hybrid jobs are kept only if their location contains one of these strings.
  # Leave empty to keep hybrid jobs anywhere.
  hybrid_locations: ["Example City", "Example City", "Example Suburb", "Example Suburb",
                     "Example Suburb", "Example Suburb", "Example Suburb", "Example Suburb",
                     "Example Suburb", "Example Suburb", "Example Suburb", "Example Suburb",
                     "Example Suburb", "Example Suburb", "Example Suburb", "Example Suburb",
                     "Example Suburb", "Example Suburb", "Example Suburb", "Example Suburb",
                     "Example Suburb"]

salary:
  minimum_annual: 125000
  # Many postings omit pay. true = keep them but flag "salary not listed".
  include_unlisted: true

employment:
  # Reject anything that looks like contract, temp, C2C, 1099 or contract-to-hire.
  exclude_contract: true

benefits:
  # true  = drop jobs whose posting never mentions benefits.
  # false = keep them but flag "benefits not mentioned" (many full-time
  #         postings omit benefits even though they offer them).
  require_mention: false

leadership:
  # Manager roles and roles mentioning direct reports are listed first in the report.
  prefer: true
